[project]
name = "rag-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erlangga", email = "erlanggasriheryanto18@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.3",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.8.3",
    "langchain-postgres>=0.0.19",
    "langgraph>=1.2.22",
    "langsmith>=0.15.0",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[project.scripts]
rag-course = "rag_course:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
